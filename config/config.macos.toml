[bootstrap.user]
login_shell = "/opt/homebrew/bin/bash"

[bootstrap.packages]
"brew:ripgrep" = "latest"
"brew:mas" = "latest"
"brew:binutils" = "latest"
"brew:coreutils" = "latest"
"brew:diffutils" = "latest"
"brew:findutils" = "latest"
"brew:gawk" = "latest"
"brew:gnu-indent" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:gnu-which" = "latest"
"brew:gpatch" = "latest"
"brew:grep" = "latest"
"brew:gzip" = "latest"
"brew:less" = "latest"
"brew:m4" = "latest"
"brew:make" = "latest"
"brew:watch" = "latest"
"brew:wdiff" = "latest"
"brew:wget" = "latest"
"brew:zip" = "latest"
"brew:micro" = "latest"
"brew:bash" = "latest"
"brew:gnupg" = "latest"
"brew:pinentry" = "latest"
"brew:pinentry-mac" = "latest"
"brew:htop" = "latest"
"brew:px" = "latest"
"brew:file-formula" = "latest"
"brew:tree" = "latest"
"brew:dust" = "latest"
"brew:duf" = "latest"
"brew:starship" = "latest"
"brew:git-delta" = "latest"

"brew-cask:kitty" = "latest"
"brew-cask:vivaldi" = "latest"
"brew-cask:thunderbird" = "latest"
"brew-cask:bitwarden" = "latest" # Bitwarden Desktop App
"brew-cask:spotify" = "latest"
"brew-cask:karabiner-elements" = "latest"


[tasks."bootstrap:install-brew"]
run = """
#!/usr/bin/env bash
if [[ ! -f /opt/homebrew/bin/brew ]]; then
    workdir=$(mktemp -d)
    pushd ${workdir} || exit 1
    gh release download --repo Homebrew/brew --pattern "*.pkg"
    open Homebrew.pkg
    popd
fi
"""
