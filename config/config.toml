[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.user]
login_shell = "bash"

[bootstrap.packages]
# MacOS
"brew:bash" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }
"brew:bitwarden-cli" =  { version = "latest", os = "macos" }
"brew-cask:bitwarden" =  { version = "latest", os = "macos" }

# Linux
"apt:flatpak" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"flatpak:bitwarden" =  { version = "latest", os = "linux" }

[bootstrap.repos]
"~/code/personal/ansible_roles" = { url = "git@github.com:mortenlj/ansible_roles.git", submodules = true }
"~/code/personal/ansible" = { url = "git@github.com:mortenlj/ansible.git" }
"~/code/personal/misc" = { url = "git@github.com:mortenlj/misc.git" }

[bootstrap.directories."/usr/local/bin"]
os = "linux"
owner = "root"
group = "root"

[bootstrap.files."/usr/local/bin/bw"]
os = "linux"
owner = "root"
group = "root"
mode = "0755"
content = """#!/usr/bin/bash
flatpak run --command=bw com.bitwarden.desktop "$@"
"""

[tasks.bootstrap]
description = "Bootstrap a machine. Called at the end of mise bootstrap."
hide = true
depends = [
    "bootstrap:*"
]

[tasks."bootstrap:ansible-vault-password"]
description = "Extract ansible vault-password from Bitwarden to disk"
hide = true
tools = { jq = "latest" }
outputs = [
    "~/.ansible/vault-pass"
]
run = """#!/usr/bin/env bash
bw login
bw list items --search "Ansible Vault" | jq -r ".[0].notes" > ~/.ansible/vault-pass
"""

[tasks."bootstrap:ansible-playbook"]
description = "Execute ansible workstations playbook"
depends = [
    "bootstrap:ansible-vault-password",
    { task = "bootstrap:install-brew", optional = true }
]
hide = true
dir = "~/code/personal/ansible"
run = "mise run workstations"

[tools]
# Kubernetes
"aqua:kubectl" = "1.37.1"
azure-kubelogin = "latest"
kind = "latest"
stern = "latest"
kubectx = "latest"
kubebuilder = "latest"
kubeseal = "latest"
helm = "latest"
kubens = "latest"
ctlptl = "latest"
kubecolor = "latest"
kubie = "latest"
k9s = "latest"
k3d = "latest"
"github:purelb/purelb" = {version = "latest", matching = "kubectl-purelb", rename_exe = "kubectl-purelb"}

# Utils / tools
dive = "latest"
cosign = "latest"
fx = "latest"
"github:pamburus/hl" = "latest"
grpcurl = "latest"
usage = "latest"
step = "latest"
"pipx:dotfiles" = "latest"
fnox = "latest"
slsa-verifier = "latest"
"github:sethvargo/ratchet" = "latest"
watchexec = "latest"
rclone = "latest"
"github:topgrade-rs/topgrade" = "latest"
"pipx:oci-cli" = "latest"
azure-cli = { version = "latest", python = "3.14" }
"pipx:checkoutmanager" = "latest"
"pipx:pgcli" = "latest"
"pipx:litecli" = "latest"
"pipx:mycli" = "latest"
"pipx:esphome" = "latest"
"pipx:platformio" = "latest"

# Languages/runtimes/adjacent
python = ["3.15.0", "3.13", "3.12", "3.11", "3.10"]
go = "latest"
node = "latest"
rust = "latest"
uv = "latest"
"pipx:pyright" = "latest"
rust-analyzer = "latest"
"npm:skills" = "latest"
"github:rtk-ai/rtk" = "latest"
yq = "latest"
zizmor = "latest"
gh = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
cargo-binstall = "latest"
delta = "latest"
krew = "latest"

[tools."github:mortenlj/bootdns"]
version = "latest"
minimum_release_age = "1s"
os = ["linux"]

[tools."github:navikt/cplt"]
version = "latest"
minimum_release_age = "1s"

[settings]
experimental = true
idiomatic_version_file_enable_tools = []
minimum_release_age = "7d"
jobs = 2

[settings.pipx]
uvx = true

[settings.python]
compile = false

[settings.github]
credential_command = "gh auth token"
use_git_credentials = true

[dotfiles]
"~/.config/mise/" = { mode = "track" }
